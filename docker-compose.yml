services:
  # Ollama LLM service
  ollama:
    image: ollama/ollama:latest
    container_name: nls-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nls-network

  # Model initialization - pulls required LLM model
  ollama-init:
    image: curlimages/curl:latest
    container_name: nls-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Pulling qwen3-vl:4b-instruct model..."
        curl -X POST http://ollama:11434/api/pull -d '{"name": "qwen3-vl:4b-instruct"}'
        echo ""
        echo "Model ready!"
    networks:
      - nls-network
    restart: "no"

  # Voice Assistant application
  voice-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nls-voice-assistant
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - GRADIO_ANALYTICS_ENABLED=False
    ports:
      - "7860:7860" # Web UI available at http://localhost:7860
    # Run in web mode for Docker (browser-based audio)
    command: ["python", "src/main.py", "--mode", "web"]
    stdin_open: true
    tty: true
    networks:
      - nls-network
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  nls-network:
    driver: bridge
